name: InfiniOps Reusable CI

on:
  workflow_call:
    inputs:
      config_path:
        description: "Path to the caller repository CI config"
        required: false
        type: string
        default: ".github/ci_config.yml"
      ci_ref:
        description: "Ref of InfiniTensor/ci to use for CI tooling"
        required: false
        type: string
        default: "infiniCore_ci"
      max_parallel:
        description: "Maximum parallel matrix jobs per job type"
        required: false
        type: number
        default: 5
      infinicore_branch:
        description: "InfiniCore branch to pass as InfiniCore_BRANCH build-arg"
        required: false
        type: string
        default: "main"

jobs:
  prepare:
    name: Generate matrix from config
    runs-on: ubuntu-latest
    outputs:
      matrix_json_for_build: ${{ steps.generate.outputs.matrix_json_for_build }}
      matrix_json_for_inferencetest: ${{ steps.generate.outputs.matrix_json_for_inferencetest }}
      matrix_json_for_benchtest: ${{ steps.generate.outputs.matrix_json_for_benchtest }}
      matrix_json_for_accuracytest: ${{ steps.generate.outputs.matrix_json_for_accuracytest }}
      matrix_json_for_servicetest: ${{ steps.generate.outputs.matrix_json_for_servicetest }}
      job_types_with_jobs: ${{ steps.generate.outputs.job_types_with_jobs }}
      infinicore_nlohmann_json_sha: ${{ steps.infinicore_third_party.outputs.nlohmann_json_sha }}
      infinicore_spdlog_sha: ${{ steps.infinicore_third_party.outputs.spdlog_sha }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          path: repo
          submodules: false
          fetch-depth: 1
          sparse-checkout: |
            .github

      - name: Checkout CI tools
        uses: actions/checkout@v4
        with:
          repository: InfiniTensor/ci
          ref: ${{ inputs.ci_ref }}
          path: repo/.ci
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /config_to_matrix.py
            /ci_resource.py
            /utils.py

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install converter dependency
        run: python -m pip install pyyaml

      - name: Convert config to matrix JSON
        id: generate
        working-directory: repo
        run: python .ci/config_to_matrix.py --config "${{ inputs.config_path }}" --write-github-outputs

      - name: Show generated job types
        run: |
          echo "job_types_with_jobs=${{ steps.generate.outputs.job_types_with_jobs }}"
          echo "matrix_json_for_build=${{ steps.generate.outputs.matrix_json_for_build }}"
          echo "matrix_json_for_inferencetest=${{ steps.generate.outputs.matrix_json_for_inferencetest }}"
          echo
          echo "matrix_json_for_benchtest=${{ steps.generate.outputs.matrix_json_for_benchtest }}"
          echo
          echo "matrix_json_for_accuracytest=${{ steps.generate.outputs.matrix_json_for_accuracytest }}"
          echo
          echo "matrix_json_for_servicetest=${{ steps.generate.outputs.matrix_json_for_servicetest }}"

      - name: Resolve InfiniCore third_party SHAs
        id: infinicore_third_party
        env:
          INFINICORE_BRANCH: ${{ inputs.infinicore_branch }}
        run: |
          SHA=$(git ls-remote https://github.com/InfiniTensor/InfiniCore.git "refs/heads/${INFINICORE_BRANCH}" | awk '{print $1}')
          if [ -z "$SHA" ]; then
            echo "Failed to resolve InfiniCore branch: ${INFINICORE_BRANCH}" >&2
            exit 1
          fi
          tmpdir=$(mktemp -d)
          git init "$tmpdir/repo"
          git -C "$tmpdir/repo" remote add origin https://github.com/InfiniTensor/InfiniCore.git
          git -C "$tmpdir/repo" fetch --depth 1 origin "${SHA}"
          echo "nlohmann_json_sha=$(git -C "$tmpdir/repo" rev-parse FETCH_HEAD:third_party/nlohmann_json)" >> "$GITHUB_OUTPUT"
          echo "spdlog_sha=$(git -C "$tmpdir/repo" rev-parse FETCH_HEAD:third_party/spdlog)" >> "$GITHUB_OUTPUT"
          rm -rf "$tmpdir"

  build-deploy-image:
    name: build and package image / ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel }}
      matrix: ${{ fromJson(needs.prepare.outputs.matrix_json_for_build) }}
    runs-on:
      - self-hosted
      - linux
      - ${{ matrix.platform }}
      - InfiniLM
    timeout-minutes: 180
    steps:
      - name: Prepare workspace for self-hosted runner
        run: rm -rf repo

      - name: Configure git for flaky networks
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/1.1

      - name: Checkout caller repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: '*'
        run: |
          set -eux
          attempts=5
          repo_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in $(seq 1 "$attempts"); do
            rm -rf repo
            if git -c protocol.version=2 init repo && \
               git -C repo remote add origin "$repo_url" && \
               git -C repo fetch --depth 1 origin "${GITHUB_SHA}" && \
               git -C repo checkout "${GITHUB_SHA}"; then
              exit 0
            fi
            echo "checkout failed (attempt ${i}/${attempts})" >&2
            rm -rf repo
            sleep "$i"
          done
          exit 1

      - name: Checkout CI tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eux
          attempts=5
          repo_url="https://x-access-token:${GITHUB_TOKEN}@github.com/InfiniTensor/ci.git"
          ref="${{ inputs.ci_ref }}"
          sparse_path="images/${{ matrix.platform }}"
          for i in $(seq 1 "$attempts"); do
            rm -rf repo/.ci
            if git -c protocol.version=2 clone \
                 --filter=blob:none \
                 --no-checkout \
                 --depth 1 \
                 --branch "${ref}" \
                 "$repo_url" repo/.ci && \
               git -C repo/.ci checkout "${ref}" && \
               git -C repo/.ci sparse-checkout init --cone && \
               git -C repo/.ci sparse-checkout set "${sparse_path}" images/install_xmake_pybind11.sh && \
               git -C repo/.ci checkout; then
              exit 0
            fi
            echo "CI tools checkout failed (attempt ${i}/${attempts})" >&2
            rm -rf repo/.ci
            sleep "$i"
          done
          exit 1

      - name: Short SHA for image tags
        run: |
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "REF_SLUG=${GITHUB_REF_NAME//\//_}" >> "$GITHUB_ENV"

      - name: Resolve InfiniCore commit SHA
        env:
          INFINICORE_BRANCH: ${{ inputs.infinicore_branch }}
        run: |
          attempts=5
          i=1
          while [ "$i" -le "$attempts" ]; do
            SHA=$(git ls-remote https://github.com/InfiniTensor/InfiniCore.git "refs/heads/${INFINICORE_BRANCH}" | awk '{print $1}')
            if [ -n "$SHA" ]; then
              echo "INFINICORE_SHA=$SHA" >> "$GITHUB_ENV"
              echo "InfiniCore ${INFINICORE_BRANCH} @ ${SHA}"
              exit 0
            fi
            echo "git ls-remote failed (attempt ${i}/${attempts})" >&2
            sleep "$i"
            i=$((i + 1))
          done
          echo "Failed to resolve InfiniCore branch: ${INFINICORE_BRANCH}" >&2
          exit 1

      - name: Resolve InfiniLM third_party SHAs
        working-directory: repo
        run: |
          echo "INFINILM_JSON_SHA=$(git rev-parse HEAD:third_party/json)" >> "$GITHUB_ENV"
          echo "INFINILM_SPDLOG_SHA=$(git rev-parse HEAD:third_party/spdlog)" >> "$GITHUB_ENV"

      - name: Build and Package
        working-directory: repo
        env:
          INFINICORE_BRANCH: ${{ inputs.infinicore_branch }}
          BUILD_ARGS_RAW: ${{ join(matrix.build_args, ' ') }}
        run: |
          src_dir=$(pwd)
          echo "src_dir: $src_dir"
          build_args="${BUILD_ARGS_RAW//__Branch_Name__/$INFINICORE_BRANCH}"
          build_arg_flags=()
          for arg in $build_args; do
            build_arg_flags+=(--build-arg "$arg")
          done
          build_arg_flags+=(--build-arg "InfiniCore_BRANCH=${INFINICORE_BRANCH}")
          build_arg_flags+=(--build-arg "InfiniCore_SHA=${INFINICORE_SHA}")
          build_arg_flags+=(--build-arg "INFINICORE_NLOHMANN_JSON_SHA=${{ needs.prepare.outputs.infinicore_nlohmann_json_sha }}")
          build_arg_flags+=(--build-arg "INFINICORE_SPDLOG_SHA=${{ needs.prepare.outputs.infinicore_spdlog_sha }}")
          build_arg_flags+=(--build-arg "INFINILM_JSON_SHA=${INFINILM_JSON_SHA}")
          build_arg_flags+=(--build-arg "INFINILM_SPDLOG_SHA=${INFINILM_SPDLOG_SHA}")
          docker build -f .ci/${{ matrix.dockerfile }} \
          "${build_arg_flags[@]}" \
          --network host --build-arg https_proxy=http://172.24.122.140:18081 --build-arg http_proxy=http://172.24.122.140:18081 --build-arg HTTPS_PROXY=http://172.24.122.140:18081 --build-arg HTTP_PROXY=http://172.24.122.140:18081 \
          -t infinilm-ci/${{ matrix.platform }}:${REF_SLUG}-${SHORT_SHA} .

  run-inferencetest:
    name: inference
    needs:
      - prepare
      - build-deploy-image
    if: contains(fromJSON(needs.prepare.outputs.job_types_with_jobs), 'inferencetest')
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel }}
      matrix: ${{ fromJson(needs.prepare.outputs.matrix_json_for_inferencetest) }}
    runs-on:
      - self-hosted
      - linux
      - ${{ matrix.platform }}
      - InfiniLM
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          path: repo
          submodules: false
          fetch-depth: 1
          sparse-checkout: |
            .github

      - name: Checkout CI tools
        uses: actions/checkout@v4
        with:
          repository: InfiniTensor/ci
          ref: ${{ inputs.ci_ref }}
          path: repo/.ci
          fetch-depth: 1
          sparse-checkout: |
            /ci_resource.py
            /daemon.sh
            /run.py
            /utils.py
            /config_to_matrix.py

      - name: Short SHA for image tags
        run: |
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "REF_SLUG=${GITHUB_REF_NAME//\//_}" >> "$GITHUB_ENV"

      - name: Install CI dependency
        working-directory: repo
        if: ${{ matrix.platform == 'cambricon' }}
        run: python3 -m pip install pyyaml

      - name: Show stage plan
        env:
          MATRIX_JSON: ${{ needs.prepare.outputs.matrix_json_for_inferencetest }}
          CURRENT_JOB: ${{ matrix.id }}
        run: |
          python3 - <<'PY'
          import json
          import os

          data = json.loads(os.environ["MATRIX_JSON"])
          current = os.environ["CURRENT_JOB"]
          entry = next((x for x in data.get("include", []) if x.get("id") == current), None)
          if not entry:
              print(f"[warn] matrix entry not found for {current}")
              raise SystemExit(0)

          test_cmd = entry.get("test_cmd", "")
          text = "\n".join([
              f"job: {entry.get('id')}",
              f"platform: {entry.get('platform')}",
              "stage order:",
              "  1) setup",
              f"  2) test -> {test_cmd}",
          ])
          print(text)

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write("### Stage plan\n\n```\n")
                  f.write(text)
                  f.write("\n```\n\n")
          PY

      - name: Build docker args and write GITHUB_ENV
        working-directory: repo
        env:
          CONFIG: ${{ inputs.config_path }}
          BRANCH: ${{ env.REF_SLUG }}
          STAGE: None
          IMAGE_TAG: "${{ env.SHORT_SHA }}"
          GPU_ID: all
          RESULT_DIR: None
          TEST: None
          LOCAL: True
        run: |
          PYTHONPATH=.ci python3 - <<'PY'
          import os
          import shlex
          import sys
          import uuid
          from pathlib import Path

          from run import (
              apply_test_override,
              build_docker_args,
              build_results_dir,
              resolve_image,
          )
          from utils import get_git_commit, load_config

          def env_opt(key):
              v = os.environ.get(key, "")
              return None if not v or v == "None" else v

          config = load_config(Path(os.environ["CONFIG"]))
          repo = config.get("repo", {})
          repo_url = repo.get("url", "https://github.com/InfiniTensor/InfiniLM.git")
          branch = env_opt("BRANCH") or repo.get("branch", "main")
          platform = "${{ matrix.platform }}"
          job_key = "${{ matrix.id }}"

          jobs = config.get("jobs", {})
          if job_key not in jobs:
              print(f"error: job {job_key!r} not in config", file=sys.stderr)
              sys.exit(1)

          job = jobs[job_key]
          all_stages = job.get("stages", [])
          stage_filter = env_opt("STAGE")
          stages = [s for s in all_stages if s["name"] == stage_filter] if stage_filter else all_stages

          if stage_filter and not stages:
              print(f"error: stage {stage_filter!r} not found in {job_key}", file=sys.stderr)
              sys.exit(1)

          test_override = env_opt("TEST")
          if test_override:
              stages = [{**s, "run": apply_test_override(s.get("run", ""), test_override)} for s in stages]

          commit = env_opt("GITHUB_SHA")
          results_base = Path(env_opt("RESULT_DIR") or "ci-results")
          results_dir = build_results_dir(results_base, platform, stages, commit)
          local_path = Path.cwd().resolve() if env_opt("LOCAL") else None

          docker_args = build_docker_args(
              config,
              job_key,
              repo_url,
              branch,
              stages,
              "/workspace",
              env_opt("IMAGE_TAG"),
              gpu_id_override=env_opt("GPU_ID") or None,
              results_dir=results_dir,
              local_path=local_path,
          )

          image_ref = resolve_image(
              config,
              job.get("platform", platform),
              env_opt("BRANCH"),
              env_opt("IMAGE_TAG") or job.get("image", "latest"),
          )

          delimiter = f"EOF_{uuid.uuid4().hex}"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"DOCKER_ARGS<<{delimiter}\n")
              f.write(shlex.join(docker_args) + "\n")
              f.write(f"{delimiter}\n")
              f.write(f"RESULT_DIR={results_dir}\n")
              f.write(f"IMAGE_REF={image_ref}\n")
          PY

      - name: Trigger ${{ matrix.platform }} Inference Test Task
        working-directory: repo
        env:
          ${{ matrix.job_env }}
        run: |
          set -e
          echo "==> running job: ${{ matrix.job_name }}"
          set -m

          if [ -n "${RESULT_DIR:-}" ] && [ "${RESULT_DIR}" != "None" ]; then
            mkdir -p "${RESULT_DIR}"
          fi

          src_dir=$(pwd)
          echo "src_dir: ${src_dir}"

          cd /data-aisoft/artifacts
          if [ ! -d "CI_${{ matrix.platform }}_test" ]; then
            mkdir -p "CI_${{ matrix.platform }}_test"
          fi
          cd CI_${{ matrix.platform }}_test
          mkdir -p ${{ github.run_id }}_${{ matrix.id }}
          cd ${{ github.run_id }}_${{ matrix.id }}

          cp "${src_dir}/.ci/daemon.sh" .
          chmod a+x ./daemon.sh

          TEST_PARAM="${TEST_PARAM//=/.}"
          DOCKER_ARGS="${DOCKER_ARGS//__WORKSPACE__/${{ github.run_id }}_${{ matrix.id }}}"
          PLATFORM=${{ matrix.platform }}
          NGPUS=${{ matrix.ngpus }}
          if [ -z $NGPUS ]; then
            NGPUS=1
          fi

          echo "**************************************************************************************"
          echo "${PLATFORM^}"
          echo "Inference"
          echo "InfiniLM"
          echo "${DOCKER_ARGS}"
          echo "${{ github.run_id }}"
          echo "${TEST_PARAM} ${NGPUS}"
          echo "infinilm-ci/${{ matrix.platform }}:${{ github.ref_name }}-${SHORT_SHA}"
          echo "**************************************************************************************"

          exec ./daemon.sh \
            "${PLATFORM^}" \
            "Inference" \
            "InfiniLM" \
            "None" \
            "${DOCKER_ARGS}" \
            ${{ github.run_id }} \
            "${TEST_PARAM} ${NGPUS}" \
            "${IMAGE_REF}"

  run-benchtest:
    name: bench
    needs:
      - prepare
      - build-deploy-image
    if: contains(fromJSON(needs.prepare.outputs.job_types_with_jobs), 'benchtest')
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel }}
      matrix: ${{ fromJson(needs.prepare.outputs.matrix_json_for_benchtest) }}
    runs-on:
      - self-hosted
      - linux
      - ${{ matrix.platform }}
      - InfiniLM
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          path: repo
          submodules: false
          fetch-depth: 1
          sparse-checkout: |
            .github

      - name: Checkout CI tools
        uses: actions/checkout@v4
        with:
          repository: InfiniTensor/ci
          ref: ${{ inputs.ci_ref }}
          path: repo/.ci
          fetch-depth: 1
          sparse-checkout: |
            /ci_resource.py
            /daemon.sh
            /run.py
            /utils.py
            /config_to_matrix.py

      - name: Short SHA for image tags
        run: |
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "REF_SLUG=${GITHUB_REF_NAME//\//_}" >> "$GITHUB_ENV"

      - name: Install CI dependency
        working-directory: repo
        if: ${{ matrix.platform == 'cambricon' }}
        run: python3 -m pip install pyyaml

      - name: Show stage plan
        env:
          MATRIX_JSON: ${{ needs.prepare.outputs.matrix_json_for_benchtest }}
          CURRENT_JOB: ${{ matrix.id }}
        run: |
          python3 - <<'PY'
          import json
          import os

          data = json.loads(os.environ["MATRIX_JSON"])
          current = os.environ["CURRENT_JOB"]
          entry = next((x for x in data.get("include", []) if x.get("id") == current), None)
          if not entry:
              print(f"[warn] matrix entry not found for {current}")
              raise SystemExit(0)

          test_cmd = entry.get("test_cmd", "")
          text = "\n".join([
              f"job: {entry.get('id')}",
              f"platform: {entry.get('platform')}",
              "stage order:",
              "  1) setup",
              f"  2) test -> {test_cmd}",
          ])
          print(text)

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write("### Stage plan\n\n```\n")
                  f.write(text)
                  f.write("\n```\n\n")
          PY

      - name: Build docker args and write GITHUB_ENV
        working-directory: repo
        env:
          CONFIG: ${{ inputs.config_path }}
          BRANCH: ${{ env.REF_SLUG }}
          STAGE: None
          IMAGE_TAG: "${{ env.SHORT_SHA }}"
          GPU_ID: all
          RESULT_DIR: None
          TEST: None
          LOCAL: True
        run: |
          PYTHONPATH=.ci python3 - <<'PY'
          import os
          import shlex
          import sys
          import uuid
          from pathlib import Path

          from run import (
              apply_test_override,
              build_docker_args,
              build_results_dir,
              resolve_image,
          )
          from utils import get_git_commit, load_config

          def env_opt(key):
              v = os.environ.get(key, "")
              return None if not v or v == "None" else v

          config = load_config(Path(os.environ["CONFIG"]))
          repo = config.get("repo", {})
          repo_url = repo.get("url", "https://github.com/InfiniTensor/InfiniLM.git")
          branch = env_opt("BRANCH") or repo.get("branch", "main")
          platform = "${{ matrix.platform }}"
          job_key = "${{ matrix.id }}"

          jobs = config.get("jobs", {})
          if job_key not in jobs:
              print(f"error: job {job_key!r} not in config", file=sys.stderr)
              sys.exit(1)

          job = jobs[job_key]
          all_stages = job.get("stages", [])
          stage_filter = env_opt("STAGE")
          stages = [s for s in all_stages if s["name"] == stage_filter] if stage_filter else all_stages

          if stage_filter and not stages:
              print(f"error: stage {stage_filter!r} not found in {job_key}", file=sys.stderr)
              sys.exit(1)

          test_override = env_opt("TEST")
          if test_override:
              stages = [{**s, "run": apply_test_override(s.get("run", ""), test_override)} for s in stages]

          commit = env_opt("GITHUB_SHA")
          results_base = Path(env_opt("RESULT_DIR") or "ci-results")
          results_dir = build_results_dir(results_base, platform, stages, commit)
          local_path = Path.cwd().resolve() if env_opt("LOCAL") else None

          docker_args = build_docker_args(
              config,
              job_key,
              repo_url,
              branch,
              stages,
              "/workspace",
              env_opt("IMAGE_TAG"),
              gpu_id_override=env_opt("GPU_ID") or None,
              results_dir=results_dir,
